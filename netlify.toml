[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Note: netlify/functions/gemini-token.mjs registers its own route at
# /api/gemini-token (via `export const config = { path: '/api/gemini-token' }`),
# handled before this SPA catch-all, so the endpoint is not rewritten to
# index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
