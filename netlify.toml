[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Note: netlify/functions/chat.mjs registers its own route at /api/chat
# (via `export const config = { path: '/api/chat' }`), handled before this
# SPA catch-all, so the AI endpoint is not rewritten to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
